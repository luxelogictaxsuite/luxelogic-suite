# Netlify build + security settings for LuxeLogic Tax Suite.
[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/suite, /admin, /form/...) loads index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers on every page. The site handles SSNs and tax documents.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=(self)"
